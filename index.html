<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Minecraft Геометричний Тренажер</title>
  <style>
    body { 
      font-family: 'Courier New', monospace; 
      background-color: #1e1e1e; 
      background-image: radial-gradient(#2b2b2b 15%, transparent 16%);
      background-size: 20px 20px;
      color: #fff; 
      text-align: center; 
      margin: 0; 
      padding: 20px; 
    }
    .card { 
      background: #2b2b2b; 
      border: 4px solid #444; 
      padding: 20px; 
      max-width: 650px; 
      margin: 20px auto; 
      border-radius: 8px; 
      box-shadow: 0 8px 25px rgba(0,0,0,0.8); 
    }
    input, button, select { 
      font-family: inherit; 
      font-size: 16px; 
      padding: 10px; 
      margin: 8px; 
      border-radius: 4px; 
      border: none; 
    }
    input[type="number"], input[type="text"] {
      background: #111;
      color: #55ff55;
      font-weight: bold;
      border: 2px solid #555;
      width: 80%;
      max-width: 300px;
      text-align: center;
    }
    button { 
      font-family: 'Courier New', monospace;
      background-color: #55ff55; 
      color: #000; 
      font-weight: bold; 
      cursor: pointer; 
      transition: background 0.2s, transform 0.1s;
      border: 2px solid #2e7d32;
    }
    button:hover { background-color: #33cc33; transform: scale(1.02); }
    .secondary-btn { background-color: #ffaa00; border-color: #e65100; color: #000; display: none; margin-top: 20px; width: 100%; max-width: 320px; }
    .secondary-btn:hover { background-color: #cc8800; }
    .next-btn { background-color: #2196f3; border-color: #0d47a1; color: #fff; display: none; margin-top: 15px; width: 100%; max-width: 320px; }
    .next-btn:hover { background-color: #1e88e5; }
    .hidden { display: none; }
    .hud { 
      display: flex; 
      justify-content: space-around; 
      background: #111; 
      padding: 12px; 
      border-radius: 6px; 
      margin-bottom: 20px; 
      font-size: 14px;
      border: 2px solid #555;
    }
    .svg-container { margin: 15px 0; background: #181818; padding: 10px; border-radius: 6px; border: 2px dashed #444; display: inline-block; }
    #feedback { font-weight: bold; font-size: 18px; margin: 15px 0; }
    .success { color: #55ff55; text-shadow: 0 0 5px rgba(85,255,85,0.4); }
    .error { color: #ff5555; text-shadow: 0 0 5px rgba(255,85,85,0.4); }
    h2, h3 { color: #ffeb3b; text-shadow: 2px 2px #000; }
  </style>
</head>
<body>

  <!-- ФОРМА РЕЄСТРАЦІЇ -->
  <div id="registration-screen" class="card">
    <h2>⛏️ МАЙНКРАФТ ГЕОМЕТРІЯ</h2>
    <p>Введіть свої дані перед початком математичної пригоди:</p>
    <input type="text" id="reg-name" placeholder="Прізвище та Ім'я" required><br>
    <input type="text" id="reg-class" placeholder="Клас (наприклад, 5-А)" required><br>
    <br>
    <button onclick="startSession()">Розпочати гру! ⚔️</button>
  </div>

  <!-- ОСНОВНИЙ ІНТЕРФЕЙС ГРИ -->
  <div id="game-screen" class="card hidden">
    <div class="hud">
      <div>👤 <span id="user-display" style="color: #ffeb3b;"></span></div>
      <div>⭐ XP: <span id="xp-val" style="color: #55ff55;">0</span></div>
      <div>💎 Алмази: <span id="diamonds-val" style="color: #00bcd4;">0</span></div>
      <div>🏆 Рівень: <span id="level-val" style="color: #ff9800;">1</span></div>
    </div>

    <h3 id="task-title">Завантаження...</h3>
    <div class="svg-container" id="svg-box"></div>
    <p id="task-desc" style="font-size: 17px; line-height: 1.4;">Завантаження...</p>
    
    <div id="question-box">
      <input type="number" id="answer-input" placeholder="Введіть число...">
      <br>
      <button id="check-btn" onclick="checkAnswer()">ВІДПОВІСТИ ⛏️</button>
      <br>
      <button id="next-btn" class="next-btn" onclick="nextTask()">НАСТУПНЕ ПИТАННЯ ➡️</button>
    </div>

    <p id="feedback"></p>
    
    <!-- Кнопка надсилання з'явиться лише в кінці -->
    <button id="send-btn" class="secondary-btn" onclick="sendDataToGoogleSheets()">📊 Надіслати результати в табель</button>
  </div>

  <script>
    // ⚠️ ВАШ АКТУАЛЬНИЙ URL ВЕБПРОГРАМИ З GOOGLE APPS SCRIPT
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyIKYgmgoml0AmrYVOWY2c3CjmRU7Agq-m_YDvsgGFyg4w5pEMUlbStSHKFgYXZECXx4w/exec";

    let userData = { name: "", class: "", xp: 0, diamonds: 0, level: 1, currentTaskIndex: 0 };
    let answeredCurrent = false;

    // Банк задач (12 задач = максимум 12 алмазів 💎)
    const tasks = [
      {
        title: "Задача 1: Площа квадрата",
        desc: "Площа квадрата = 144 см². Знайдіть сторону квадрата (см).",
        answer: 12,
        svg: `<svg width="140" height="140" viewBox="0 0 100 100"><rect x="15" y="15" width="70" height="70" fill="#795548" stroke="#3e2723" stroke-width="4"/><text x="50" y="55" fill="white" font-size="12" text-anchor="middle" font-weight="bold">S = 144 см²</text></svg>`
      },
      {
        title: "Задача 1 (продовження): Периметр",
        desc: "Сторона квадрата дорівнює 12 см. Знайдіть периметр квадрата (см).",
        answer: 48,
        svg: `<svg width="140" height="140" viewBox="0 0 100 100"><rect x="15" y="15" width="70" height="70" fill="#795548" stroke="#3e2723" stroke-width="4"/><text x="50" y="55" fill="white" font-size="13" text-anchor="middle" font-weight="bold">а = 12 см</text></svg>`
      },
      {
        title: "Задача 2: Розбиття квадрата",
        desc: "Великий квадрат зі стороною 10 см розбили на 4 однакові квадрати. Знайдіть сторону одного маленького квадрата (см).",
        answer: 5,
        svg: `<svg width="140" height="140" viewBox="0 0 100 100"><rect x="15" y="15" width="70" height="70" fill="none" stroke="#3e2723" stroke-width="4"/><line x1="50" y1="15" x2="50" y2="85" stroke="#3e2723" stroke-width="2"/><line x1="15" y1="50" x2="85" y2="50" stroke="#3e2723" stroke-width="2"/><text x="50" y="55" fill="#ffeb3b" font-size="12" text-anchor="middle" font-weight="bold">10 см</text></svg>`
      },
      {
        title: "Задача 2 (продовження): Площа частини",
        desc: "Сторона маленького квадрата дорівнює 5 см. Знайдіть його площу (см²).",
        answer: 25,
        svg: `<svg width="140" height="140" viewBox="0 0 100 100"><rect x="30" y="30" width="40" height="40" fill="#4caf50" stroke="#2e7d32" stroke-width="3"/><text x="50" y="55" fill="white" font-size="11" text-anchor="middle" font-weight="bold">5 см</text></svg>`
      },
      {
        title: "Задача 3: Прямокутник з квадратів",
        desc: "Прямокутник розбили на 2 квадрати зі стороною 5 см. Знайдіть довжину більшої сторони прямокутника (см).",
        answer: 10,
        svg: `<svg width="160" height="120" viewBox="0 0 140 100"><rect x="20" y="25" width="50" height="50" fill="#2196f3" stroke="#0d47a1" stroke-width="2"/><rect x="70" y="25" width="50" height="50" fill="#03a9f4" stroke="#0d47a1" stroke-width="2"/><text x="70" y="55" fill="white" font-size="11" text-anchor="middle" font-weight="bold">5 см</text></svg>`
      },
      {
        title: "Задача 3 (продовження): Площа прямокутника",
        desc: "Сторони прямокутника 10 см і 5 см. Знайдіть його загальну площу (см²).",
        answer: 50,
        svg: `<svg width="160" height="120" viewBox="0 0 140 100"><rect x="20" y="25" width="100" height="50" fill="#ff9800" stroke="#e65100" stroke-width="3"/><text x="70" y="55" fill="white" font-size="11" text-anchor="middle" font-weight="bold">10 × 5 см</text></svg>`
      },
      {
        title: "Задача 4: Площа кімнати з гардеробом",
        desc: "Площа кімнати 10×8 м без прямокутного кутка 3×4 м під гардероб. Знайдіть чисту площу кімнати (м²).",
        answer: 68,
        svg: `<svg width="140" height="140" viewBox="0 0 100 100"><polygon points="15,15 85,15 85,85 50,85 50,55 15,55" fill="#9c27b0" stroke="#4a148c" stroke-width="3"/><text x="50" y="38" fill="white" font-size="10" text-anchor="middle" font-weight="bold">10×8 м</text><text x="32" y="72" fill="#ffeb3b" font-size="8" text-anchor="middle">3×4 гардероб</text></svg>`
      },
      {
        title: "Задача 5: Рівні площі",
        desc: "Площі прямокутника (4×9 см) і квадрата рівні. Знайдіть сторону цього квадрата (см).",
        answer: 6,
        svg: `<svg width="140" height="140" viewBox="0 0 100 100"><rect x="15" y="30" width="70" height="40" fill="#e91e63" stroke="#880e4f" stroke-width="2"/><text x="50" y="55" fill="white" font-size="11" text-anchor="middle" font-weight="bold">4 × 9 см</text></svg>`
      },
      {
        title: "Задача 6: Периметр і сторони",
        desc: "Периметр прямокутника = 40 см, одна сторона у 3 рази більша за іншу. Знайдіть меншу сторону (см).",
        answer: 5,
        svg: `<svg width="160" height="120" viewBox="0 0 140 100"><rect x="20" y="25" width="100" height="50" fill="#00bcd4" stroke="#006064" stroke-width="3"/><text x="70" y="55" fill="white" font-size="12" text-anchor="middle" font-weight="bold">P = 40 см</text></svg>`
      },
      {
        title: "Задача 6 (продовження): Площа прямокутника",
        desc: "Сторони прямокутника 15 см і 5 см. Знайдіть площу прямокутника (см²).",
        answer: 75,
        svg: `<svg width="160" height="120" viewBox="0 0 140 100"><rect x="20" y="25" width="100" height="50" fill="#8bc34a" stroke="#33691e" stroke-width="3"/><text x="70" y="55" fill="white" font-size="12" text-anchor="middle" font-weight="bold">15 × 5 см</text></svg>`
      },
      {
        title: "Задача 7: Периметр за площею квадрата",
        desc: "Площа квадратного майданчика дорівнює 81 см². Знайдіть периметр цього квадрата (см).",
        answer: 36,
        svg: `<svg width="140" height="140" viewBox="0 0 100 100"><rect x="15" y="15" width="70" height="70" fill="#607d8b" stroke="#263238" stroke-width="4"/><text x="50" y="55" fill="white" font-size="11" text-anchor="middle" font-weight="bold">S = 81 см²</text></svg>`
      },
      {
        title: "Задача 8: Периметр прямокутника",
        desc: "Прямокутник має довжину 12 см і ширину 4 см. Знайдіть його периметр (см).",
        answer: 32,
        svg: `<svg width="160" height="120" viewBox="0 0 140 100"><rect x="15" y="25" width="110" height="50" fill="#3f51b5" stroke="#1a237e" stroke-width="3"/><text x="70" y="55" fill="white" font-size="11" text-anchor="middle" font-weight="bold">12 × 4 см</text></svg>`
      }
    ];

    function startSession() {
      const name = document.getElementById("reg-name").value.trim();
      const userClass = document.getElementById("reg-class").value.trim();
      if (!name || !userClass) {
        alert("Будь ласка, заповніть усі поля!");
        return;
      }
      userData.name = name;
      userData.class = userClass;
      
      document.getElementById("registration-screen").classList.add("hidden");
      document.getElementById("game-screen").classList.remove("hidden");
      document.getElementById("user-display").innerText = `${name} (${userClass})`;
      loadTask();
    }

    function loadTask() {
      if (userData.currentTaskIndex >= tasks.length) {
        document.getElementById("task-title").innerText = "🎉 Вітаємо!";
        document.getElementById("svg-box").innerHTML = "";
        document.getElementById("task-desc").innerText = "Ви успішно пройшли всі задачі тренажера та стали майстром геометрії!";
        document.getElementById("question-box").classList.add("hidden");
        document.getElementById("feedback").innerHTML = "<span class='success'>Всі задачі складено! Можете надіслати результати в табель.</span>";
        // Показуємо кнопку відправки результатів у кінці
        document.getElementById("send-btn").style.display = "inline-block";
        return;
      }

      answeredCurrent = false;
      const current = tasks[userData.currentTaskIndex];
      document.getElementById("task-title").innerText = current.title;
      document.getElementById("svg-box").innerHTML = current.svg;
      document.getElementById("task-desc").innerText = current.desc;
      document.getElementById("answer-input").value = "";
      document.getElementById("answer-input").disabled = false;
      document.getElementById("check-btn").style.display = "inline-block";
      document.getElementById("next-btn").style.display = "none";
      document.getElementById("feedback").innerText = "";
    }

    function checkAnswer() {
      if (answeredCurrent) return;

      const userAns = parseFloat(document.getElementById("answer-input").value);
      const current = tasks[userData.currentTaskIndex];
      const feedback = document.getElementById("feedback");

      if (isNaN(userAns)) {
        feedback.className = "error";
        feedback.innerText = "Введіть числове значення!";
        return;
      }

      answeredCurrent = true;
      document.getElementById("answer-input").disabled = true;
      document.getElementById("check-btn").style.display = "none";

      if (userAns === current.answer) {
        feedback.className = "success";
        feedback.innerText = "Правильно! +50 XP, +1 💎";
        userData.xp += 50;
        userData.diamonds += 1;
        
        // Система рівнів (кожні 150 XP рівень вище)
        userData.level = Math.floor(userData.xp / 150) + 1;
        updateHUD();
      } else {
        feedback.className = "error";
        feedback.innerText = `Неправильно! Правильна відповідь: ${current.answer} ❌`;
      }

      // Показуємо кнопку "Наступне питання"
      document.getElementById("next-btn").style.display = "inline-block";
    }

    function nextTask() {
      userData.currentTaskIndex++;
      loadTask();
    }

    function updateHUD() {
      document.getElementById("xp-val").innerText = userData.xp;
      document.getElementById("diamonds-val").innerText = userData.diamonds;
      document.getElementById("level-val").innerText = userData.level;
    }

    function sendDataToGoogleSheets() {
      if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes("AKfycby...")) {
        alert("Будь ласка, вкажіть дійсний URL вашої вебпрограми з Google Apps Script у коді!");
        return;
      }

      const payload = {
        timestamp: new Date().toLocaleString("uk-UA"),
        studentName: userData.name,
        studentClass: userData.class,
        xp: userData.xp,
        diamonds: userData.diamonds,
        level: userData.level,
        completedTasks: `${Math.min(userData.currentTaskIndex, tasks.length)} / ${tasks.length}`
      };

      fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      }).then(() => {
        alert("Результати успішно надіслано до Google Таблиці! 🚀");
      }).catch(err => {
        alert("Помилка відправки: " + err);
      });
    }
  </script>
</body>
</html>
